<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>法語每日練習本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout idea: sticky tab bar over a single column of cards; practice runs as a full-screen lesson with a bottom feedback bar. */
:root{
  --bg:#ffffff; --inset:#f3f5fa; --surface:#ffffff; --ink:#1d2742; --muted:#62708f; --line:#e1e6f0;
  --brand:#2c5bff; --brand-edge:#1a3fc2; --brand-soft:#e6ecff;
  --ok:#2f9e4f; --ok-soft:#e1f5e7; --ok-edge:#237a3c;
  --bad:#d93a3f; --bad-soft:#fde7e8; --bad-edge:#a82a2e;
  --m:#2c5bff; --m-soft:#e6ecff; --f:#c2255c; --f-soft:#fde6ef;
  --flag:#e5484d;
  --new:#fff2c9; --new-edge:#e0a800; --new-ink:#7a5600;
  --font-body:"Nunito","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1526; --inset:#0f1526; --surface:#18203a; --ink:#eaf0ff; --muted:#9aa8cc; --line:#2a3558;
    --brand:#6f93ff; --brand-edge:#4468e0; --brand-soft:#1f2c58;
    --ok:#4cc272; --ok-soft:#173a26; --ok-edge:#2f9e4f;
    --bad:#ff6a6f; --bad-soft:#442026; --bad-edge:#d93a3f;
    --m:#7fa0ff; --m-soft:#1f2c58; --f:#ff7fae; --f-soft:#45213a; color-scheme:dark; --new:#3d3314; --new-edge:#c79a1c; --new-ink:#ffd666;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1526; --inset:#0f1526; --surface:#18203a; --ink:#eaf0ff; --muted:#9aa8cc; --line:#2a3558;
  --brand:#6f93ff; --brand-edge:#4468e0; --brand-soft:#1f2c58;
  --ok:#4cc272; --ok-soft:#173a26; --ok-edge:#2f9e4f;
  --bad:#ff6a6f; --bad-soft:#442026; --bad-edge:#d93a3f;
  --m:#7fa0ff; --m-soft:#1f2c58; --f:#ff7fae; --f-soft:#45213a; color-scheme:dark; --new:#3d3314; --new-edge:#c79a1c; --new-ink:#ffd666;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 80px}
header.top{padding:22px 0 8px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.stripe{height:6px;background:linear-gradient(90deg,var(--brand) 0 33.3%,var(--surface) 33.3% 66.6%,var(--flag) 66.6%);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:26px;font-weight:900;letter-spacing:.2px}
h1 small{display:block;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:0}
select{font:inherit;font-weight:800;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;padding:10px 0;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs button{flex:0 0 auto;padding:9px 16px;border-radius:999px;border:2px solid transparent;background:transparent;font-weight:800;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
nav.tabs .n{margin-left:6px;background:var(--bad);color:#fff;border-radius:999px;font-size:12px;padding:1px 7px}
section.view{padding-top:18px}
h2{font-size:20px;font-weight:900;margin:24px 0 10px;display:flex;align-items:center;gap:10px}
h2 .cnt{font-size:13px;font-weight:800;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:1px 10px;border-radius:999px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-weight:800;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=search]{font:inherit;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);min-width:0;flex:1 1 160px}
.say{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:2px solid var(--brand);background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;padding:0}
.say svg{width:20px;height:20px}
.say:active{transform:translateY(1px)}
/* vocab card */
.wcard{display:flex;flex-direction:column;gap:6px}
.wtop{display:flex;gap:12px;align-items:center}
.fr{font-size:24px;font-weight:900;line-height:1.2}
.ipa{color:var(--muted);font-weight:700;font-size:15px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.b{font-size:12px;font-weight:800;border-radius:8px;padding:1px 8px;border:1.5px solid var(--line);color:var(--muted)}
.b.m{background:var(--m-soft);color:var(--m);border-color:var(--m)}
.b.f{background:var(--f-soft);color:var(--f);border-color:var(--f)}
.zh{font-size:18px;font-weight:800}
.zh.hide{color:transparent;background:var(--line);border-radius:8px;cursor:pointer;user-select:none;width:fit-content;min-width:80px}
.ex{font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;margin-top:2px;display:flex;gap:8px;align-items:flex-start}
.ex b{color:var(--ink)}
.ex .say{width:28px;height:28px}.ex .say svg{width:15px;height:15px}
.sims{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:2px}
.simlabel{font-size:12px;font-weight:900;color:var(--muted)}
.sim{display:inline-flex;gap:6px;align-items:baseline;border:1.5px solid var(--brand);background:var(--brand-soft);border-radius:10px;padding:2px 8px;font-size:13px;color:var(--ink)}
.sim.ext{border-style:dashed;background:transparent;border-color:var(--line)}
.sim b{font-weight:800}.sim span{color:var(--muted)}
.sim i{font-style:normal;font-size:11px;font-weight:800;color:var(--f);background:var(--f-soft);border-radius:6px;padding:0 5px}
/* grammar */
.gcard h3{margin:0 0 6px;font-size:18px;font-weight:900;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:12px;font-weight:800;background:var(--brand-soft);color:var(--brand);border-radius:8px;padding:1px 8px}
.tag.ext{background:var(--f-soft);color:var(--f)}
.gcard p{margin:4px 0}
.exrows{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.exrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--inset);border-radius:12px;padding:6px 10px}
.exrow .say{width:30px;height:30px}.exrow .say svg{width:16px;height:16px}
.exrow .fr{font-size:18px}
.alpha{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.alpha button{background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:6px 2px;text-align:center}
.alpha b{display:block;font-size:22px;font-weight:900}
.alpha span{font-size:12px;color:var(--muted);font-weight:700}
/* sentences */
.dlg{display:flex;flex-direction:column;gap:8px}
.bub{max-width:88%;border-radius:18px;padding:8px 14px;display:flex;gap:10px;align-items:center}
.bub.a{background:var(--brand-soft);align-self:flex-start;border-bottom-left-radius:4px}
.bub.b{background:var(--ok-soft);align-self:flex-end;border-bottom-right-radius:4px}
.bub .fr{font-size:19px}
.sent{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sent:last-child{border:0}
.sent .fr{font-size:20px}
.sent .zh{font-size:15px;color:var(--muted);font-weight:700}
.wchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.wchips span{font-size:11px;font-weight:800;background:var(--inset);border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--muted)}
.maker{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.maker output{font-size:26px;font-weight:900}
/* practice setup */
.setup{display:flex;flex-direction:column;gap:14px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.opt .box{flex:0 0 22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:900;color:#fff;margin-top:2px}
.opt[aria-pressed="true"] .box{background:var(--brand);border-color:var(--brand)}
.opt b{display:block}.opt span{color:var(--muted);font-size:14px}
.btn{border:0;border-radius:16px;padding:13px 24px;font-weight:900;font-size:17px;letter-spacing:.5px;border-bottom:5px solid;transition:transform .05s}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand-edge)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok-edge)}
.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad-edge)}
.btn.ghost{background:transparent;color:var(--muted);border:2px solid var(--line);border-bottom-width:5px}
.btn:disabled{background:var(--line);color:var(--muted);border-color:var(--line);cursor:not-allowed;transform:none}
.btn.small{padding:7px 14px;font-size:14px;border-bottom-width:3px;border-radius:12px}
.hist{display:flex;gap:6px;flex-wrap:wrap}
.hist span{font-weight:800;font-size:13px;background:var(--inset);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.note{font-size:14px;color:var(--muted)}

.n.hw{background:var(--brand)}
.hwbar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}
.hwbar i{display:block;height:100%;background:var(--ok);border-radius:99px}
details.task{margin-bottom:10px;padding:0}
details.task>summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;padding:14px 18px;flex-wrap:wrap}
details.task>summary::-webkit-details-marker{display:none}
details.task>summary b{flex:1 1 200px;font-size:17px}
details.task[open]>summary{border-bottom:1px solid var(--line)}
details.task>:not(summary){margin-left:18px;margin-right:18px}
details.task>*:last-child{margin-bottom:16px}
details.task.finished{border-color:var(--ok)}
.prog{font-weight:900;font-size:13px;color:var(--muted)}
details.finished .prog{color:var(--ok)}
.hwgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.hwgrid.big{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.hwlines{display:flex;flex-direction:column;gap:8px}
.hwitem{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:6px 10px;background:var(--surface)}
.hwitem.got{border-color:var(--ok);background:var(--ok-soft)}
.hwitem .say{width:32px;height:32px}.hwitem .say svg{width:17px;height:17px}
.hwtxt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.hwtxt b{font-size:18px;font-weight:900}.hwtxt b.bigl{font-size:24px}
.hwtxt small{color:var(--muted);font-weight:700}.hwtxt small.nt{color:var(--f)}
.ipa.cover{color:transparent;background:var(--line);border-radius:6px;user-select:none;width:fit-content}
.tick{min-width:44px;height:36px;border-radius:12px;border:2px solid var(--line);background:var(--inset);font-weight:900;color:var(--muted)}
.hwitem.got .tick{background:var(--ok);border-color:var(--ok-edge);color:#fff}
.rules{margin:6px 0 10px;padding-left:22px}.rules li{margin:4px 0}
.done{display:flex;gap:8px;align-items:center;font-weight:800;margin-top:10px}
.done input{width:20px;height:20px}
.attach{margin-top:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.attimg{max-width:260px;border-radius:12px;border:2px solid var(--line)}
.dict{display:flex;flex-direction:column;gap:8px}
.drow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:2px solid var(--line);border-radius:14px;padding:6px 10px}
.drow.ok{border-color:var(--ok);background:var(--ok-soft)}.drow.bad{border-color:var(--bad);background:var(--bad-soft)}
.drow .dn{width:22px;font-weight:900;color:var(--muted)}
.drow input{font:inherit;font-weight:900;font-size:18px;letter-spacing:3px;text-transform:uppercase;width:130px;padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:var(--inset);color:var(--ink)}
.dres{font-weight:800;font-size:14px}
.newtag{font-size:12px;font-weight:900;background:var(--new-edge);color:#1d2742;border-radius:8px;padding:1px 8px;white-space:nowrap}
.newlesson .card{background:var(--new);border-color:var(--new-edge)}
.newlesson .sim{background:var(--surface)}.newlesson .exrow,.newlesson .hwitem{background:var(--surface)}
details.task.isnew{background:var(--new);border-color:var(--new-edge)}
details.task.isnew .hwitem{background:var(--surface)}
details.task.isnew.finished{border-color:var(--ok)}
/* quiz overlay */
#quiz{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
#quiz[hidden]{display:none}
.qtop{display:flex;gap:14px;align-items:center;max-width:760px;width:100%;margin:0 auto;padding:16px}
.xbtn{background:none;border:0;color:var(--muted);padding:4px;display:grid;place-items:center}
.xbtn svg{width:26px;height:26px}
.bar{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .3s}
.qscore{font-weight:900;color:var(--ok);min-width:44px;text-align:right}
#qarea{flex:1;overflow:auto;max-width:760px;width:100%;margin:0 auto;padding:8px 16px 24px}
.qkind{font-size:13px;font-weight:900;color:var(--brand);text-transform:none;letter-spacing:.5px}
.qprompt{font-size:24px;font-weight:900;margin:4px 0 16px;text-wrap:balance}
.bigplay{display:flex;gap:12px;align-items:center;justify-content:center;margin:10px 0 22px}
.bigplay .say{width:84px;height:84px;border-radius:24px;border-bottom-width:6px}
.bigplay .say svg{width:40px;height:40px}
.slow{height:48px;padding:0 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:800;color:var(--muted)}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:center;text-align:left;padding:13px 16px;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--surface);font-size:19px;font-weight:800}
.choice kbd{flex:0 0 28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font:800 13px var(--font-body);color:var(--muted)}
.choice.sel{border-color:var(--brand);background:var(--brand-soft)}
.choice.sel kbd{border-color:var(--brand);color:var(--brand)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice[disabled]{cursor:default}
.two{grid-template-columns:1fr 1fr}
.blank{font-size:34px;font-weight:900;text-align:center;margin:12px 0 22px}
.blank u{display:inline-block;min-width:80px;border-bottom:4px solid var(--line);text-decoration:none;color:var(--brand)}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.matchgrid .choice{justify-content:center;text-align:center;font-size:17px;padding:12px 8px}
.matchgrid .choice.done{opacity:.45;border-color:var(--ok);background:var(--ok-soft)}
.matchgrid .choice.shake{animation:shake .3s;border-color:var(--bad);background:var(--bad-soft)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tray{min-height:62px;border-bottom:3px solid var(--line);border-top:3px solid var(--line);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tok{padding:9px 14px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);font-size:19px;font-weight:800}
.tok.gone{visibility:hidden}
.bad-sent{font-size:26px;font-weight:900;text-align:center;margin:14px 0 20px;text-wrap:balance}
.bad-sent mark{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:0 8px;text-decoration:underline wavy var(--bad)}
.speakbox{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.speakbox .fr{font-size:36px}
.mic{width:96px;height:96px;border-radius:50%;border:0;border-bottom:6px solid var(--brand-edge);background:var(--brand);color:#fff;display:grid;place-items:center}
.mic.live{background:var(--bad);border-color:var(--bad-edge);animation:pulse 1s infinite}
.mic svg{width:42px;height:42px}
@keyframes pulse{50%{transform:scale(1.07)}}
.heard{min-height:28px;font-size:18px;font-weight:800}
#qfoot{border-top:2px solid var(--line);background:var(--surface);padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
#qfoot.ok{background:var(--ok-soft);border-color:var(--ok)}
#qfoot.bad{background:var(--bad-soft);border-color:var(--bad)}
.fbin{max-width:760px;margin:0 auto;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.fbtxt{flex:1 1 260px;min-width:0}
.fbmsg{font-size:20px;font-weight:900}
#qfoot.ok .fbmsg{color:var(--ok)}#qfoot.bad .fbmsg{color:var(--bad)}
.fbexp{font-size:15px;font-weight:700}
.fbbtn{display:flex;gap:10px}
.fbhint{font-size:12px;font-weight:700;color:var(--muted);margin-top:2px}
/* results */
.res{max-width:760px;margin:0 auto;padding:20px 16px 60px;width:100%}
.score{text-align:center;padding:10px 0 20px}
.score .big{font-size:64px;font-weight:900;line-height:1}
.stars{font-size:34px;color:#f5a524;letter-spacing:4px}
.rlist{display:flex;flex-direction:column;gap:8px}
.ritem{border:2px solid var(--line);border-left-width:8px;border-radius:14px;background:var(--surface);padding:10px 14px}
.ritem.ok{border-left-color:var(--ok)}.ritem.bad{border-left-color:var(--bad)}
.ritem .k{font-size:12px;font-weight:900;color:var(--muted)}
.ritem .q{font-weight:900}
.ritem .e{font-size:14px;color:var(--muted);font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
@media (max-width:520px){.two{grid-template-columns:1fr}h1{font-size:22px}.qprompt{font-size:21px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-spk" viewBox="0 0 24 24"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12h-2z"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" d="M5 5l14 14M19 5L5 19"/></symbol>
</svg>

<div class="stripe"></div>
<div class="wrap">
  <header class="top">
    <h1>法語每日練習本<small>Mon cahier de français</small></h1>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <label>學習日 <select id="daySel" aria-label="選擇學習日"></select></label>
      <label>外觀 <select id="themeSel" aria-label="外觀"><option value="light">白色</option><option value="dark">深色</option><option value="auto">跟隨系統</option></select></label>
      <label>發音 <select id="engSel" aria-label="發音引擎"><option value="auto">自動</option><option value="browser">瀏覽器語音</option><option value="claude">Claude 語音</option></select></label>
    </div>

/* ============================ 工具 ============================ */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'');
function lev(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
const sim = (a,b) => { a=norm(a); b=norm(b); const L=Math.max(a.length,b.length); return L?1-lev(a,b)/L:0; };
const spk = () => `<svg><use href="#i-spk"/></svg>`;
const store = {mem:{}, get(k,d){try{const v=localStorage.getItem(k); if(v!==null) return JSON.parse(v)}catch(e){} return k in this.mem?this.mem[k]:d}, set(k,v){this.mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ============================ 發音 ============================ */
/* 發音策略：
   單字很短，沒有上下文，Claude 語音容易把 papa、âne 當成英文唸。
   所以「自動」模式下：單字／短片語優先用瀏覽器的法語語音（明確指定 fr-FR 聲音），
   整句才用 Claude 語音；找不到法語聲音時才退回 Claude 語音（明確指定 fr-FR）。
   右上角可手動切換引擎，挑唸得對的那個。 */
let claudeTTS = null, voiceFR = null;
const ENGINE_LABEL = {auto:'自動', browser:'瀏覽器語音', claude:'Claude 語音'};
let engine = store.get('fr-engine', 'auto');
try { if (window.claude && claude.use) claude.use('tts').then(t => { claudeTTS = t || null; updateVoiceInfo(); }).catch(()=>{}); } catch(e){}
function pickVoice(){
  try {
    const vs = speechSynthesis.getVoices().filter(v => /^fr/i.test(v.lang.replace('_','-')));
    voiceFR = vs.find(v => /^fr[-_]FR$/i.test(v.lang) && /google|amélie|thomas|audrey|marie|hortense|denise|henri/i.test(v.name))
           || vs.find(v => /^fr[-_]FR$/i.test(v.lang)) || vs[0] || null;
  } catch(e){ voiceFR = null; }
  updateVoiceInfo();
}
try { pickVoice(); speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch(e){}
function updateVoiceInfo(){
  const el = document.getElementById('voiceInfo'); if(!el) return;
  el.textContent = `瀏覽器法語聲音：${voiceFR ? voiceFR.name : '找不到'} ／ Claude 語音：${claudeTTS ? '可用' : '不可用'}`;
}
const wordKeyMap = () => { if(!wordKeyMap.m){ wordKeyMap.m = {}; allVocab().forEach(w => { wordKeyMap.m[w.fr.replace(/\s*\?$/,'').toLowerCase()] = w.say || w.fr; }); } return wordKeyMap.m; };
function cleanText(text){
  let t = text.replace(/[!?]/g,'').replace(/\s+/g,' ').trim();
  const alt = wordKeyMap()[t.toLowerCase()];   // 有指定 say 的單字用指定拼法
  return alt || t;
}
/* 全站只用「同一個引擎、同一個聲音」：
   自動 = 有瀏覽器法語聲音就一律用它（每次都是同一個人、同一種法語）；
   沒有才改用 Claude 語音，並固定聲音與 fr-FR。唸錯時不再偷偷換引擎。 */
let lastSay = 0;
function say(text, rate=1){
  const now = Date.now(); if (now - lastSay < 250) return; lastSay = now;   // 連點只算一次
  const t = cleanText(text);
  let use = engine;
  if (use === 'auto') use = voiceFR ? 'browser' : (claudeTTS ? 'claude' : 'none');
  if (use === 'browser' && !voiceFR) use = claudeTTS ? 'claude' : 'none';
  if (use === 'claude' && !claudeTTS) use = voiceFR ? 'browser' : 'none';
  if (use === 'claude') {
    try{ speechSynthesis.cancel(); }catch(e){}
    claudeTTS.speak(t, {voice:'buttery', language:'fr-FR', rate: Math.min(1.5, Math.max(0.7, rate))}).catch(()=>{});
  } else if (use === 'browser') browserSay(t, rate);
}
function browserSay(t, rate){
  try {
    try{ claudeTTS && claudeTTS.stop(); }catch(e){}
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.voice = voiceFR; u.lang = voiceFR.lang; u.rate = rate; u.pitch = 1; u.volume = 1;
    setTimeout(() => { try{ speechSynthesis.speak(u); }catch(e){} }, 60);
  } catch(e){}
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-say]');
  if (b) { say(b.dataset.say, b.dataset.slow ? .7 : 1); }
});

/* ============================ 出題 ============================ */
function poolFor(scope){
  const Ls = scope==='all' ? LESSONS : [lesson()];
  return {words:Ls.flatMap(l=>l.vocab), sents:Ls.flatMap(l=>l.sents), fixes:Ls.flatMap(l=>l.fixes)};
}
function pickDistract(w, words, n, byShape){
  let c = words.filter(x => x.key!==w.key && x.zh!==w.zh && norm(x.fr)!==norm(w.fr) && x.ipa!==w.ipa);
  if(byShape){ c = c.sort((a,b)=>lev(norm(a.fr),norm(w.fr))-lev(norm(b.fr),norm(w.fr))).slice(0,Math.max(n+3,8)); }
  else { const same = c.filter(x=>x.cat===w.cat); c = shuffle(same).concat(shuffle(c.filter(x=>x.cat!==w.cat))).slice(0,n+3); }
  return shuffle(c).slice(0,n);
}
const MAKE = {
  listenFR(w, P){ const o = shuffle([w, ...pickDistract(w,P.words,3,true)]); return {type:'listenFR', key:'w:'+w.key, w, opts:o.map(x=>x.fr), ans:w.fr, say:w.fr,
    expl:`${w.fr} [${w.ipa}] ＝ ${w.zh}`}; },
  listenZH(w, P){ const o = shuffle([w, ...pickDistract(w,P.words,3,false)]); return {type:'listenZH', key:'w:'+w.key, w, opts:o.map(x=>x.zh), ans:w.zh, say:w.fr,
    expl:`${w.fr} [${w.ipa}] ＝ ${w.zh}`}; },
  zh2fr(w, P){ const o = shuffle([w, ...pickDistract(w,P.words,3,false)]); return {type:'zh2fr', key:'w:'+w.key, w, opts:o.map(x=>x.fr), ans:w.fr,
    expl:`${w.zh} 的法文是 ${w.fr} [${w.ipa}]` + (w.g?`（${w.g==='m'?'陽':'陰'}性）`:'')}; },
  gender(w){ const a = w.g==='f'?'une':'un'; return {type:'gender', key:'w:'+w.key, w, ans:a, opts:['un','une'],
    expl:`${w.fr} 是${w.g==='f'?'陰':'陽'}性名詞 (${w.g}.)，所以用 ${a} ${w.fr}。${w.zh}`}; },
  speak(w){ return {type:'speak', key:'w:'+w.key, w, expl:`標準唸法：${w.fr} [${w.ipa}]`}; },
  match(w, P, set){ const ws = [w, ...pickDistract(w,P.words,4,false)].filter((x,i,a)=>a.findIndex(y=>y.zh===x.zh)===i).slice(0,5);
    return {type:'match', key:'w:'+w.key, words:ws, expl:ws.map(x=>`${x.fr}＝${x.zh}`).join('；')}; },
  build(s, P){
    const tokens = s.fr.split(' '); const lowers = tokens.map(t=>t.toLowerCase().replace(/[,.!?]/g,''));
    const decoys = shuffle(P.sents.filter(x=>x.id!==s.id).flatMap(x=>x.fr.split(' ')).filter(t=>/[a-zàâçéèêîôû]/i.test(t) && !lowers.includes(t.toLowerCase().replace(/[,.!?]/g,'')))).slice(0,1);
    return {type:'build', key:'s:'+s.id, s, tokens, pool:shuffle([...tokens,...decoys]), expl:`${s.fr}　${s.zh}`};
  },
  fix(f){ return {type:'fix', key:'f:'+f.id, f, opts:shuffle(f.opts), ans:f.ans, expl:`${f.pre}${f.ans}${f.post}　${f.why}`}; }
};
function buildQuiz(){
  const st = S.setup; let qs = [];
  if(st.scope==='wrong'){
    const keys = shuffle(Object.keys(bank()));
    const basic = ['listenFR','listenZH','zh2fr'];
    const P = poolFor('all');
    keys.slice(0, st.count).forEach(k => {
      let q;
      if(k.startsWith('w:')){ const w = wordByKey(k.slice(2)); if(!w) return; const t = shuffle(basic.concat((w.g&&w.pos==='n')?['gender']:[]))[0]; q = MAKE[t](w,P); }
      else if(k.startsWith('s:')){ const s = findSent(k.slice(2)); if(!s) return; q = MAKE.build(s,P); }
      else { const f = findFix(k.slice(2)); if(!f) return; q = MAKE.fix(f); }
      q.review = true; qs.push(q);
    });
    return qs;
  }
  const P = poolFor(st.scope);
  const types = st.types.filter(t => (t==='build'?P.sents.length: t==='fix'?P.fixes.length: t==='gender'?P.words.some(w=>w.g&&w.pos==='n'): P.words.length));
  if(!types.length) return [];
  const decks = {words:shuffle(P.words), gwords:shuffle(P.words.filter(w=>w.g&&w.pos==='n')), sents:shuffle(P.sents), fixes:shuffle(P.fixes)};
  const take = (k) => { const d = decks[k]; const x = d.shift(); d.push(x); return x; };
  let order = []; while(order.length<st.count) order = order.concat(shuffle(types));
  order = shuffle(order.slice(0, st.count));
  order.forEach(t => {
    if(t==='build') qs.push(MAKE.build(take('sents'),P));
    else if(t==='fix') qs.push(MAKE.fix(take('fixes')));
    else if(t==='gender') qs.push(MAKE.gender(take('gwords')));
    else qs.push(MAKE[t](take('words'),P));
  });
  return qs;
}

let Q = null; // {qs,i,res:[],ok:0}
let curCtl = null;
function startQuiz(){
  const qs = buildQuiz();
  if(!qs.length){ alert_(`沒有可出的題目，請至少選一種題型。`); return; }
  Q = {qs, i:0, res:[], ok:0, scope:S.setup.scope};
  $('#quiz').hidden = false; document.body.style.overflow='hidden';
  showQ();
}
function alert_(m){ const v=$('#view'); const d=document.createElement('div'); d.className='card'; d.style.marginTop='12px'; d.innerHTML=`<b>${esc(m)}</b>`; v.appendChild(d); setTimeout(()=>d.remove(),3500); }
function closeQuiz(){ stopDictation(); try{speechSynthesis.cancel()}catch(e){} try{claudeTTS&&claudeTTS.stop()}catch(e){} $('#quiz').hidden = true; document.body.style.overflow=''; Q=null; curCtl=null; render(); }
function setProgress(){ $('#qbar').style.width = (Q.i/Q.qs.length*100)+'%'; $('#qscore').textContent = Q.ok; }
function footCheck(enabled=false, withSkip=true, showCheck=true){
  const f = $('#qfoot'); f.className='';
  f.innerHTML = `<div class="fbin"><div class="fbbtn">${withSkip?'<button class="btn ghost" id="skip">略過</button>':''}</div>${showCheck?`<button class="btn primary" id="check" ${enabled?'':'disabled'}>檢查</button>`:''}</div>`;
}
function showQ(){
  const q = Q.qs[Q.i]; setProgress(); stopDictation();
  const area = $('#qarea'); area.scrollTop = 0; curCtl = {done:false};
  footCheck(false, true, q.type==='build');  // 選擇題、配對、跟讀都不用按檢查
  area.innerHTML = '';
  RENDER[q.type](q, area, curCtl);
}
function finish(q, ok, given, missedKeys){
  if(curCtl.done) return; curCtl.done = true; curCtl.doneAt = Date.now();
  Q.res.push({q, ok, given}); if(ok) Q.ok++;
  const b = bank();
  const keys = missedKeys || [q.key];
  if(!ok){ keys.forEach(k => b[k] = (b[k]||0)+1); }
  else if(q.review){ delete b[q.key]; }
  store.set('fr-wrong', b); setProgress();
  const f = $('#qfoot'); f.className = ok?'ok':'bad';
  const msgs = ok ? ['答對了！','太棒了！','完全正確！','很好！'] : ['答錯了','再接再厲','正確答案如下'];
  f.innerHTML = `<div class="fbin"><div class="fbtxt"><div class="fbmsg">${msgs[Math.floor(Math.random()*msgs.length)]}</div><div class="fbexp">${esc(q.expl)}</div><div class="fbhint">點畫面任何地方也能繼續</div></div><button class="btn ${ok?'ok':'bad'}" id="next">${Q.i+1>=Q.qs.length?'看結果':'繼續'}</button></div>`;
  $('#next').focus();
  if(curCtl.lock) curCtl.lock();
}
function nextQ(){ Q.i++; if(Q.i>=Q.qs.length) return showResults(); showQ(); }
function showResults(){
  setProgress(); $('#qbar').style.width='100%';
  const n = Q.qs.length, ok = Q.ok, pct = Math.round(ok/n*100);
  const stars = pct>=90?3:pct>=70?2:pct>=40?1:0;
  const grade = pct>=90?'優秀':pct>=70?'不錯':pct>=40?'再練練':'從頭複習';
  if(Q.scope!=='wrong' || true){ const h = hist(); h.push({date:new Date().toLocaleDateString('zh-TW',{month:'numeric',day:'numeric'}), ok, total:n}); store.set('fr-hist', h.slice(-30)); }
  const wrongQs = Q.res.filter(r=>!r.ok);
  $('#qfoot').className=''; $('#qfoot').innerHTML='';
  $('#qarea').innerHTML = `<div class="res"><div class="score"><div class="stars" aria-label="${stars} 顆星">${'★'.repeat(stars)}<span style="color:var(--line)">${'★'.repeat(3-stars)}</span></div>
    <div class="big">${pct}<small style="font-size:28px">分</small></div><div style="font-weight:900;font-size:20px">${grade} ・ ${ok} / ${n} 題答對</div></div>
    <div class="row" style="justify-content:center;margin-bottom:22px">
      ${wrongQs.length?`<button class="btn primary" id="redoWrong">重做答錯的 ${wrongQs.length} 題</button>`:''}
      <button class="btn ${wrongQs.length?'ghost':'primary'}" id="again">再練一次</button><button class="btn ghost" id="home">回首頁</button></div>
    <h2>逐題解析</h2><div class="rlist">${Q.res.map((r,i)=>`<div class="ritem ${r.ok?'ok':'bad'}"><div class="k">第 ${i+1} 題 ・ ${TYPE_LABEL[r.q.type]} ・ ${r.ok?'答對':'答錯'}</div><div class="q">${esc(qTitle(r.q))}</div>${!r.ok&&r.given?`<div class="e">你的答案：${esc(r.given)}</div>`:''}<div class="e">${esc(r.q.expl)}</div></div>`).join('')}</div></div>`;
  $('#again')?.addEventListener('click', startQuiz);
  $('#home')?.addEventListener('click', closeQuiz);
  $('#redoWrong')?.addEventListener('click', () => {
    const qs = wrongQs.map(r => { const q = Object.assign({}, r.q); if(q.opts) q.opts = shuffle(q.opts); if(q.pool) q.pool = shuffle(q.pool); q.retry = true; return q; });
    Q = {qs, i:0, res:[], ok:0, scope:'retry'}; showQ();
  });
}
function qTitle(q){
  if(q.type==='listenFR'||q.type==='listenZH') return `（聽音）${q.w.fr}`;
  if(q.type==='zh2fr') return `${q.w.zh} → ?`;
  if(q.type==='gender') return `___ ${q.w.fr}`;
  if(q.type==='speak') return `跟讀：${q.w.fr}`;
  if(q.type==='match') return '配對：'+q.words.map(w=>w.fr).join('、');
  if(q.type==='build') return q.s.zh;
  return q.f.pre+q.f.err+q.f.post;
}

/* ---- 各題型畫面 ---- */
const RENDER = {};
function choiceUI(q, area, ctl, {prompt, kind, big, two, blank}){
  area.innerHTML = `<div class="qkind">${kind}</div><div class="qprompt">${prompt}</div>${big||''}${blank||''}<div class="choices ${two?'two':''}" role="group" aria-label="選項">${q.opts.map((o,i)=>`<button class="choice" data-i="${i}"><kbd>${i+1}</kbd><span>${esc(o)}</span></button>`).join('')}</div>`;
  let sel = -1; const btns = [...area.querySelectorAll('.choice')];
  const pick = i => { if(ctl.done) return; sel = i; btns.forEach((b,j)=>b.classList.toggle('sel', j===i)); const c=$('#check'); if(c) c.disabled=false;
    const bl = area.querySelector('.blank u'); if(bl) bl.textContent = q.opts[i]; ctl.check(); };
  btns.forEach((b,i)=> b.addEventListener('click', () => pick(i)));
  ctl.pick = pick;
  ctl.check = () => { if(sel<0) return; const ok = q.opts[sel]===q.ans; ctl.lockIt(ok);
    finish(q, ok, q.opts[sel]); };
  ctl.lockIt = () => { btns.forEach((b,j)=>{ b.disabled=true; b.classList.remove('sel'); if(q.opts[j]===q.ans) b.classList.add('right'); else if(j===sel) b.classList.add('wrong'); }); };
  ctl.skip = () => { sel=-1; ctl.lockIt(false); finish(q,false,'（略過）'); };
}
const bigPlay = (t) => `<div class="bigplay"><button class="say" data-say="${esc(t)}" aria-label="播放發音">${spk()}</button><button class="slow" data-say="${esc(t)}" data-slow="1">慢速</button></div>`;
RENDER.listenFR = (q,a,c) => { choiceUI(q,a,c,{kind:'聽音選法文', prompt:'你聽到的是哪一個字？', big:bigPlay(q.say)}); setTimeout(()=>say(q.say),250); };
RENDER.listenZH = (q,a,c) => { choiceUI(q,a,c,{kind:'聽音選中文', prompt:'這個字是什麼意思？', big:bigPlay(q.say)}); setTimeout(()=>say(q.say),250); };
RENDER.zh2fr = (q,a,c) => choiceUI(q,a,c,{kind:'看中文選法文', prompt:`「${esc(q.w.zh)}」的法文是？`});
RENDER.gender = (q,a,c) => choiceUI(q,a,c,{kind:'陰陽性冠詞', prompt:`選出正確的不定冠詞　${esc(q.w.zh)}`, two:true, blank:`<div class="blank"><u>&nbsp;</u> ${esc(q.w.fr)}</div>`});
RENDER.fix = (q,a,c) => {
  const wrong = q.f.pre + q.f.err + q.f.post, right = q.f.pre + q.f.ans + q.f.post;
  choiceUI(q,a,c,{kind:'改錯', prompt:'紅色部分有錯，選出正確的寫法',
    blank:`<div class="bad-sent">${esc(q.f.pre)}<mark>${esc(q.f.err)}</mark>${esc(q.f.post)}</div>
      <div class="bigplay" style="margin:-8px 0 18px"><button class="say" id="fixSay" data-say="${esc(wrong)}" aria-label="朗讀句子">${spk()}</button><button class="slow" data-say="${esc(wrong)}" data-slow="1">慢速</button></div>`});
  // 答完後，朗讀鈕改唸正確的句子
  c.lock = () => { a.querySelectorAll('.bigplay [data-say]').forEach(b => b.dataset.say = right); };
};

RENDER.match = (q, area, ctl) => {
  const L = shuffle(q.words), R = shuffle(q.words); let selL=null, miss=0, done=0; const missed=new Set(); const given=[];
  area.innerHTML = `<div class="qkind">配對單字</div><div class="qprompt">把法文和中文配成一對</div>
    <div class="matchgrid" id="mg">${L.map((w,i)=>`<button class="choice" data-l="${i}">${esc(w.fr)}</button><button class="choice" data-r="${i}">${esc(R[i].zh)}</button>`).join('')}</div>`;
  // 左右欄交錯排版：左邊是 L[i]，右邊是 R[i]
  const lb = [...area.querySelectorAll('[data-l]')], rb = [...area.querySelectorAll('[data-r]')];
  lb.forEach((b,i)=>b.addEventListener('click',()=>{ if(b.classList.contains('done')||ctl.done) return; lb.forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); selL=i; say(L[i].fr); }));
  rb.forEach((b,i)=>b.addEventListener('click',()=>{
    if(b.classList.contains('done')||ctl.done||selL===null) return;
    const w = L[selL];
    if(R[i].key===w.key){ lb[selL].classList.add('done'); lb[selL].classList.remove('sel'); b.classList.add('done'); selL=null; done++;
      if(done===q.words.length) finish(q, miss===0, miss?`${miss} 次配錯`:'', [...missed].map(k=>'w:'+k)); }
    else { miss++; missed.add(w.key); b.classList.add('shake'); lb[selL].classList.add('shake'); const l=lb[selL]; setTimeout(()=>{b.classList.remove('shake');l.classList.remove('shake')},350); }
  }));
  ctl.skip = () => finish(q,false,'（略過）');
};
RENDER.build = (q, area, ctl) => {
  area.innerHTML = `<div class="qkind">排列句子</div><div class="qprompt">${esc(q.s.zh)}</div>
    <div class="bigplay" style="margin:0 0 12px;justify-content:flex-start"><button class="say" data-say="${esc(q.s.fr)}" aria-label="聽整句">${spk()}</button></div>
    <div class="tray" id="tray" aria-label="你的句子"></div><div class="pool" id="pool">${q.pool.map((t,i)=>`<button class="tok" data-i="${i}">${esc(t)}</button>`).join('')}</div>`;
  const tray=$('#tray',area), pool=[...area.querySelectorAll('.tok')]; let picked=[];
  const redraw = () => { tray.innerHTML = picked.map((i,k)=>`<button class="tok" data-k="${k}">${esc(q.pool[i])}</button>`).join('');
    pool.forEach((b,i)=>b.classList.toggle('gone', picked.includes(i))); const c=$('#check'); if(c) c.disabled = picked.length===0;
    tray.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('click',()=>{ if(ctl.done) return; picked.splice(+b.dataset.k,1); redraw(); })); };
  pool.forEach((b,i)=>b.addEventListener('click',()=>{ if(ctl.done) return; picked.push(i); redraw(); }));
  ctl.check = () => { const ans = picked.map(i=>q.pool[i]).join(' '); const ok = ans===q.tokens.join(' '); pool.forEach(b=>b.disabled=true); finish(q, ok, ans); };
  ctl.skip = () => finish(q,false,'（略過）'); redraw();
};

/* 跟讀：優先用頁面的聽寫功能，沒有麥克風就改自評 */
let dict = null, dictCur = null;
try { if (window.claude && claude.use) claude.use('dictation').then(d => {
  dict = d || null;
  if(d){ d.onPartial && d.onPartial(({text}) => dictCur && dictCur.partial(text));
         d.onFinal && d.onFinal(({text}) => dictCur && dictCur.final(text));
         d.onState && d.onState(({state, reason}) => dictCur && dictCur.state(state, reason)); }
}).catch(()=>{}); } catch(e){}
function stopDictation(){ try{ dict && dict.stop && dict.stop().catch(()=>{}); }catch(e){} }
RENDER.speak = (q, area, ctl) => {
  area.innerHTML = `<div class="qkind">跟讀發音</div><div class="qprompt">大聲唸出這個字</div>
   <div class="speakbox"><div class="fr">${esc(q.w.fr)}</div><div class="ipa">[${esc(q.w.ipa)}] ・ ${esc(q.w.zh)}</div>
   <div class="bigplay" style="margin:0"><button class="say" data-say="${esc(q.w.fr)}" aria-label="聽標準發音">${spk()}</button><button class="slow" data-say="${esc(q.w.fr)}" data-slow="1">慢速</button></div>
   <div id="micArea"><button class="mic" id="mic" aria-label="按下開始錄音"><svg><use href="#i-mic"/></svg></button><div class="note" style="margin-top:6px">按下麥克風，唸完會自動比對</div></div>
   <div class="heard" id="heard" aria-live="polite"></div><div id="selfArea"></div>
   <button class="chip" id="selfBtn">改用自評</button></div>`;
  const mic = $('#mic', area), heard = $('#heard', area), selfArea = $('#selfArea', area);
  let listening = false, text = '', sawListening = false, lastState = '', t1 = null, t2 = null;
  const selfRate = () => { selfArea.innerHTML = `<div class="note" style="margin-bottom:8px">先聽標準發音，唸一次，再誠實評分。</div><div class="row" style="justify-content:center;margin:0"><button class="btn ok" id="selfOk">唸得很接近</button><button class="btn ghost" id="selfNo">還要再練</button></div>`;
    $('#selfOk',area).onclick = () => finish(q,true,'自評：接近'); $('#selfNo',area).onclick = () => finish(q,false,'自評：還要再練'); };
  const stopUI = () => { clearTimeout(t1); clearTimeout(t2); listening = false; mic.classList.remove('live'); };
  const fail = m => { stopUI(); heard.textContent = m; selfRate(); };
  const judge = alts => {
    const best = Math.max(...alts.flatMap(x => [sim(x, q.w.fr), ...x.split(/\s+/).map(y => sim(y, q.w.fr))]));
    const ok = best >= 0.75;
    q.expl = `${q.expl}　系統聽成「${alts[0]}」，相似度 ${Math.round(best*100)}%`;
    finish(q, ok, `聽成「${alts[0]}」`);
  };
  const evaluate = () => { if(ctl.done) return; const t = text.trim(); if(!t){ heard.textContent = '沒有聽到聲音，請靠近麥克風再按一次，或改用自評。'; return; } judge([t]); };
  const startDict = () => {
    dictCur = {
      partial: t => { if(listening) heard.textContent = '聽到：'+t; },
      final: t => { text += ' '+t; heard.textContent = '聽到：'+text.trim(); clearTimeout(t2); t2 = setTimeout(() => { dict.stop().catch(()=>{}); }, 900); },
      state: (st, reason) => { lastState = st + (reason ? `（${reason}）` : '');
        if(st === 'listening'){ sawListening = true; return; }
        if(st === 'idle' && listening && sawListening){ stopUI(); evaluate(); } }
    };
    text = ''; sawListening = false; listening = true; mic.classList.add('live'); heard.textContent = '準備收音…';
    dict.start().catch(err => fail('語音聽寫沒有啟動（'+((err && (err.code || err.message)) || '未知原因')+'），已改用自評。'));
    t1 = setTimeout(() => { if(listening && !sawListening) fail('語音聽寫沒有開始收音（狀態：'+(lastState||'沒有回應')+'），已改用自評。'); }, 3000);
    t2 = setTimeout(() => { if(listening) dict.stop().catch(()=>{}); }, 9000);
  };
  let curRec = null;
  const startSR = SR => {
    let rec, got = false; const texts = [], ev = [], t0 = Date.now();
    try{ rec = new SR(); }catch(e){ fail('無法啟動語音辨識，已改用自評。'); return; }
    curRec = rec;
    rec.lang = 'fr-FR'; rec.maxAlternatives = 5; rec.interimResults = true; rec.continuous = true;
    ['audiostart','soundstart','speechstart','speechend','soundend','audioend','nomatch'].forEach(n => { rec['on'+n] = () => ev.push(n); });
    listening = true; mic.classList.add('live'); heard.textContent = '請唸…（唸完會自動結束，也可以再按一次麥克風結束）';
    rec.onresult = e => {
      for(let i = e.resultIndex; i < e.results.length; i++){
        const r = e.results[i]; heard.textContent = '聽到：'+r[0].transcript;
        if(r.isFinal){ texts.push(...[...r].map(x => x.transcript)); clearTimeout(t1); t1 = setTimeout(() => { try{ rec.stop(); }catch(_){} }, 900); }
      } };
    rec.onerror = e => { got = true; const m = e.error==='not-allowed'||e.error==='service-not-allowed' ? '瀏覽器不允許使用麥克風（'+e.error+'），已改用自評。' : e.error==='no-speech' ? '沒有偵測到聲音，請靠近麥克風再按一次。' : e.error==='network' ? '語音辨識需要連網，目前連不上（network）。' : '收音失敗（'+e.error+'），已改用自評。';
      stopUI(); heard.textContent = m; if(e.error!=='no-speech') selfRate(); };
    rec.onend = () => { const was = listening; stopUI(); curRec = null;
      if(ctl.done) return;
      if(texts.length){ judge(texts); return; }
      if(was && !got){
        const sec = ((Date.now()-t0)/1000).toFixed(1);
        const hint = !ev.includes('audiostart') ? '麥克風沒有真正開啟，可能是權限被擋、沒有選到麥克風裝置，或別的程式正在使用。'
                   : !ev.includes('speechstart') ? '麥克風有開，但沒偵測到說話聲，請靠近麥克風、提高音量，或到系統設定確認選對輸入裝置。'
                   : '有偵測到聲音，但辨識不出任何字，請再唸清楚一點。';
        heard.textContent = `沒有收到內容（${sec} 秒；事件：${ev.join(' → ') || '無'}）。${hint}`; } };
    try{ rec.start(); }catch(e){ fail('無法開始收音：'+e.message); return; }
    t2 = setTimeout(() => { try{ rec.stop(); }catch(e){} }, 9000);
  };
  mic.onclick = () => {
    if(ctl.done) return;
    if(listening){ if(curRec){ try{ curRec.stop(); }catch(e){} } else if(dict) dict.stop().catch(()=>{}); return; }
    selfArea.innerHTML = '';
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(dict) startDict();            // 優先用頁面提供的聽寫
    else if(SR) startSR(SR);         // 備用：瀏覽器內建辨識，指定法語
    else fail('這個環境沒有語音辨識，無法收音。請先聽標準發音，唸一次，再自評。');
  };
  $('#selfBtn', area).onclick = selfRate;
  ctl.skip = () => finish(q,false,'（略過）');
};

/* ============================ 事件 ============================ */
document.addEventListener('click', e => {
  const t = e.target;
  const tab = t.closest('[data-tab]'); if(tab){ S.tab = tab.dataset.tab; render(); return; }
  const tk = t.closest('[data-tick]'); if(tk){ const [tid,i] = tk.dataset.tick.split('|'); const task = HW.flatMap(l=>l.tasks).find(x=>x.id===tid); const st = hwSt(tid); const rep=task.rep||1; const n=((st.items[i]||0)+1)%(rep+1); if(n) st.items[i]=n; else delete st.items[i]; hwSave(tid,st); keepScroll(()=>render()); return; }
  const hs = t.closest('[data-hwshow]'); if(hs){ const k=hs.dataset.hwshow; S.hwShow[k]=!S.hwShow[k]; keepScroll(()=>render()); return; }
  const dc = t.closest('[data-dcheck]'); if(dc){ const [tid,i]=dc.dataset.dcheck.split('|'); checkDict(tid,+i); keepScroll(()=>render()); return; }
  const da = t.closest('[data-dall]'); if(da){ const tid=da.dataset.dall; const task=HW.flatMap(l=>l.tasks).find(x=>x.id===tid); task.items.forEach((_,i)=>{ if((S.dict[tid]&&S.dict[tid][i]&&S.dict[tid][i].val)) checkDict(tid,i); }); keepScroll(()=>render()); return; }
  const cat = t.closest('[data-cat]'); if(cat){ S.cat = cat.dataset.cat; render(); return; }
  if(t.closest('#hideZh')){ S.hide = !S.hide; render(); return; }
  const rv = t.closest('[data-reveal]'); if(rv){ rv.classList.toggle('hide'); return; }
  const cnt = t.closest('[data-count]'); if(cnt){ S.setup.count = +cnt.dataset.count; store.set('fr-setup',S.setup); render(); return; }
  const sc = t.closest('[data-scope]'); if(sc){ if(sc.disabled) return; S.setup.scope = sc.dataset.scope; store.set('fr-setup',S.setup); render(); return; }
  const ty = t.closest('[data-type]'); if(ty){ const k=ty.dataset.type, a=S.setup.types; S.setup.types = a.includes(k)? a.filter(x=>x!==k) : a.concat(k); store.set('fr-setup',S.setup); render(); return; }
  if(t.closest('#start')){ startQuiz(); return; }
  if(t.closest('#reviewAll')){ S.setup.scope='wrong'; startQuiz(); return; }
  if(t.closest('#clearBank')){ store.set('fr-wrong',{}); render(); return; }
  const rm = t.closest('[data-rm]'); if(rm){ const b=bank(); delete b[rm.dataset.rm]; store.set('fr-wrong',b); render(); return; }
  if(t.closest('#qx')){ closeQuiz(); return; }
  if(t.closest('#check') && curCtl && curCtl.check){ curCtl.check(); return; }
  if(t.closest('#skip') && curCtl && curCtl.skip){ curCtl.skip(); return; }
  if(t.closest('#next')){ nextQ(); return; }
  // 答完之後，點畫面任何地方（喇叭、離開等按鈕除外）就進下一題
  if(Q && curCtl && curCtl.done && $('#next') && !$('#quiz').hidden && Date.now() - curCtl.doneAt > 350 && t.closest('#quiz') && !t.closest('[data-say],.say,.slow,#qx,audio,input,select,textarea')){ nextQ(); return; }
});
function keepScroll(fn){ const y = window.scrollY; fn(); window.scrollTo(0,y); }
document.addEventListener('input', e => { const el = e.target.closest && e.target.closest('[data-dict]'); if(!el) return; const [tid,i] = el.dataset.dict.split('|'); const D = S.dict[tid] || (S.dict[tid]={}); (D[i] || (D[i]={})).val = el.value; });
document.addEventListener('change', e => {
  const dn = e.target.closest && e.target.closest('[data-hwdone]'); if(dn){ const st = hwSt(dn.dataset.hwdone); st.done = dn.checked; hwSave(dn.dataset.hwdone, st); keepScroll(()=>render()); return; }
  const at = e.target.closest && e.target.closest('[data-att]'); if(at && at.files && at.files[0]){ const f = at.files[0]; (ATT[at.dataset.att] = ATT[at.dataset.att]||[]).push({name:f.name, type:f.type||'', url:URL.createObjectURL(f)}); keepScroll(()=>render()); }
});
document.addEventListener('toggle', e => { const d = e.target; if(d && d.matches && d.matches('details[data-task]')) S.hwOpen[d.dataset.task] = d.open; }, true);
document.addEventListener('keydown', e => {
  if($('#quiz').hidden || !curCtl) return;
  if(e.key==='Enter'){ const n=$('#next'); if(n){ e.preventDefault(); nextQ(); return; } const c=$('#check'); if(c && !c.disabled){ e.preventDefault(); curCtl.check&&curCtl.check(); } }
  else if(/^[1-4]$/.test(e.key) && curCtl.pick && !curCtl.done){ const i=+e.key-1; const q=Q.qs[Q.i]; if(q.opts && i<q.opts.length) curCtl.pick(i); }
});
$('#daySel').innerHTML = LESSONS.map(l=>`<option value="${l.id}">${esc(l.day)} ・ ${esc(l.title)}${l.id===newestL()?'（新）':''}</option>`).join('');
$('#daySel').addEventListener('change', e => { S.lesson = e.target.value; S.maker=null; render(); });
function applyTheme(t){ const r = document.documentElement; if(t==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', t); }
let themePref = store.get('fr-theme', 'light'); applyTheme(themePref);
$('#themeSel').value = themePref;
$('#themeSel').addEventListener('change', e => { themePref = e.target.value; store.set('fr-theme', themePref); applyTheme(themePref); });
$('#engSel').value = engine;
$('#engSel').addEventListener('change', e => { engine = e.target.value; store.set('fr-engine', engine); });
updateVoiceInfo();
render();
</script>
</body>
